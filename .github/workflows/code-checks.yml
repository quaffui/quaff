name: Code Checks

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  run-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust docgen
        run: |
          cargo fmt --manifest-path docgen/Cargo.toml --check
          cargo clippy --manifest-path docgen/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path docgen/Cargo.toml --all-targets --locked

      - name: Generate docs
        run: |
          bun run gen:plugins
          bun run docgen-props
          bun run docgen-snippets

      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run Tests
        run: bun run test:unit --run

      - name: Run Type Check
        run: bun run check

      - name: Run Lint
        run: bun run lint
