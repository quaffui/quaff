<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // prevents a white flash on load for dark mode users
      let currentDisplayMode = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";

      try {
        const savedDisplayMode = localStorage.getItem("displayMode");

        if (savedDisplayMode === "dark" || savedDisplayMode === "light") {
          currentDisplayMode = savedDisplayMode;
        }
      } catch {
        // Use the system preference when storage is unavailable.
      }

      document.documentElement.style.colorScheme = currentDisplayMode;
      document.body.classList.add(`body--${currentDisplayMode}`);
    </script>

    <div>%sveltekit.body%</div>
  </body>
</html>
